name: ci

# Standard library only. The suite reseeds the SQLite demo database, replays
# the 30-question evaluation and the guard-on / guard-off ablation, and fails
# if either committed artifact — eval/last_run.json or eval/ablation.json —
# no longer matches a fresh run.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests and claim checks
        run: python -m unittest discover -s tests -v
      - name: Evaluation artifact matches a fresh run
        run: python scripts/eval.py --check
      - name: Ablation artifact matches a fresh run
        run: python scripts/ablation.py --check
      - name: Demo anchors vs JPJ registrations artifact matches a fresh run
        run: python scripts/anchor_vs_jpj.py --check
